         `removeChild` and blanks the whole app. We ship a real English version at
         /en (offered by a banner), so machine translation is opt-out here. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="QEYL6BLAbKeL5quH2HqGY-LNdZ_2Idn8897fpe7dj8w" />
    <meta name="naver-site-verification" content="ae841556971ad20b970948ce5536fbd095a92e47" />

    />

         publishes this site. sameAs lists only channels confirmed to exist; add
         new official channels here as they're created. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.heimdex.co/#organization",
            "name": "HEIMDEX",
            "alternateName": ["하임덱스", "주식회사 하임덱스", "Heimdex"],
            "url": "https://www.heimdex.co/",
            "logo": "https://www.heimdex.co/favicon-192.png",
            "image": "https://www.heimdex.co/og-image.png",
            "slogan": "Data Stays, Insight Moves",
            "description": "하임덱스(HEIMDEX)는 원본 영상을 외부 서버로 옮기지 않고 검색·요약·재편집하는 온프레미스 AI 영상 검색 솔루션을 만드는 기업입니다.",
            "email": "heimdex@heimdex.co",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "heimdex@heimdex.co",
              "url": "https://www.heimdex.co/contact",
              "availableLanguage": ["Korean", "English"]
            },
            "brand": [
              { "@type": "Brand", "name": "HEIMDEX" },
              { "@type": "Brand", "name": "HEIMLOG", "alternateName": "하임로그", "url": "https://heimlog.heimdex.co/" }

            "sameAs": [
              "https://blog.heimdex.co/",
              "https://www.linkedin.com/company/heimdex/",
              "https://www.instagram.com/heimdex.official/",
              "https://www.tiktok.com/@heimdex"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.heimdex.co/#website",
            "url": "https://www.heimdex.co/",
            "name": "HEIMDEX",
            "alternateName": "하임덱스",
            "inLanguage": ["ko", "en"],
            "publisher": { "@id": "https://www.heimdex.co/#organization" }
          }
        ]
      }
    </script>
