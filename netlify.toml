# Netlify equivalent of vercel.json. The two can coexist — each host reads only
# its own file — so a Netlify preview does not take the site off Vercel.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # `scripts/prerender-en.mjs` uses top-level await and node: imports; pin the
  # runtime rather than inheriting whatever Netlify's default is that month.
  NODE_VERSION = "20"

# ⚠️ ORDER IS THE WHOLE POINT. Netlify takes the FIRST matching rule, so the
# English shell has to be claimed before the catch-all below sends every path to
# the Korean one — otherwise /en serves Korean OG tags to KakaoTalk and Slack,
# which is the exact thing prerender-en.mjs exists to prevent.
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

# The contact form posts here. INERT until api/contact.js is ported to
# netlify/functions/contact.js — Netlify functions take (Request) and return a
# Response, where the Vercel one takes (req, res). Without that port this returns
# a clean 404 instead of handing the form an HTML page to parse as JSON.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Everything else is the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
